name: Publish HACS release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-hacs-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate integration
    uses: ./.github/workflows/validate-hacs.yaml
    permissions:
      contents: read

  plan:
    name: Plan release from manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py plan --version-file custom_components/route_progress/manifest.json

  release:
    name: Create versioned HACS release
    needs: [plan, validate]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Publish and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --version-file custom_components/route_progress/manifest.json
